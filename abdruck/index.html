<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Abdruck</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="Ein Fidget für den Bildschirm: Berührung wird zu Farbe, Fingerkuppe zu Abdruck.">
<meta name="theme-color" content="#050508">
<meta name="color-scheme" content="dark">

<!-- iOS: als App vom Home-Bildschirm starten -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Abdruck">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="manifest" href="manifest.webmanifest">

<style>
  :root{
    --ui:#f4f2ff; --ui-dim:rgba(244,242,255,.5);
    --pad-t:env(safe-area-inset-top,0px);
    --pad-r:env(safe-area-inset-right,0px);
    --pad-b:env(safe-area-inset-bottom,0px);
    --pad-l:env(safe-area-inset-left,0px);
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#050508;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
    color:var(--ui);
    touch-action:none;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  }
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;}

  /* ---------- der einzige sichtbare Knopf ---------- */
  #knob{
    position:fixed;z-index:3;
    top:calc(var(--pad-t) + 10px);right:calc(var(--pad-r) + 10px);
    width:44px;height:44px;border:0;background:none;padding:0;
    display:grid;place-items:center;cursor:pointer;
    opacity:.28;transition:opacity .5s ease;
  }
  #knob::before{
    content:"";width:9px;height:9px;border-radius:50%;
    border:1.5px solid var(--ui);
  }
  #knob.awake{opacity:.85;}
  #knob:active{opacity:1;}

  /* ---------- Einstellungen ---------- */
  #panel{
    position:fixed;z-index:4;inset:auto 0 0 0;
    padding:22px calc(var(--pad-r) + 20px) calc(var(--pad-b) + 26px) calc(var(--pad-l) + 20px);
    background:rgba(10,10,16,.72);
    -webkit-backdrop-filter:blur(24px) saturate(1.4);backdrop-filter:blur(24px) saturate(1.4);
    border-top:1px solid rgba(255,255,255,.09);
    border-radius:22px 22px 0 0;
    transform:translateY(102%);transition:transform .42s cubic-bezier(.22,1,.36,1);
    max-height:82vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  }
  #panel.open{transform:translateY(0);}
  #panel h2{
    margin:0 0 18px;font-size:.62rem;font-weight:500;letter-spacing:.24em;
    text-transform:uppercase;color:var(--ui-dim);font-family:var(--mono);
  }
  .row{margin:0 0 20px;}
  .row > label{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;
    color:var(--ui-dim);font-family:var(--mono);margin:0 0 9px;
  }
  .row output{font-variant-numeric:tabular-nums;}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:26px;background:none;margin:0;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:2px;background:rgba(255,255,255,.22);border-radius:2px;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:22px;height:22px;margin-top:-10px;border-radius:50%;
    background:var(--ui);box-shadow:0 0 14px rgba(255,255,255,.35);
  }
  #pals{display:flex;gap:26px 10px;flex-wrap:wrap;}
  .sw{
    width:52px;height:52px;border-radius:16px;border:1.5px solid transparent;
    padding:0;cursor:pointer;position:relative;
    box-shadow:0 4px 16px rgba(0,0,0,.4);
  }
  .sw[aria-pressed="true"]{border-color:var(--ui);transform:scale(1.06);}
  .sw span{
    position:absolute;left:0;right:0;bottom:-17px;font-size:.5rem;letter-spacing:.1em;
    text-transform:uppercase;color:var(--ui-dim);font-family:var(--mono);text-align:center;
  }
  #pals{margin-bottom:22px;padding-bottom:14px;}
  .switch{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;
    color:var(--ui-dim);font-family:var(--mono);
  }
  .switch button{
    border:1px solid rgba(255,255,255,.25);background:none;color:var(--ui);
    font:inherit;letter-spacing:.14em;padding:8px 14px;border-radius:999px;cursor:pointer;
  }
  .switch button[aria-pressed="true"]{background:var(--ui);color:#0a0a10;}
  #close{
    width:100%;margin-top:6px;padding:14px;border-radius:14px;
    border:1px solid rgba(255,255,255,.16);background:none;color:var(--ui);
    font-family:var(--mono);font-size:.62rem;letter-spacing:.24em;text-transform:uppercase;cursor:pointer;
  }
  .hint{
    font-family:var(--mono);font-size:.56rem;line-height:1.7;letter-spacing:.06em;
    color:var(--ui-dim);margin:0 0 20px;
  }

  /* ---------- erster Hinweis ---------- */
  #hello{
    position:fixed;z-index:2;inset:0;display:grid;place-items:center;pointer-events:none;
    transition:opacity 1.1s ease;
  }
  #hello p{
    font-family:var(--mono);font-size:.62rem;letter-spacing:.3em;text-transform:uppercase;
    color:rgba(244,242,255,.42);margin:0;text-align:center;line-height:2.2;
    animation:pulse 3.4s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.8}}
  #hello.gone{opacity:0;}

  #fail{
    position:fixed;inset:0;z-index:9;display:none;place-items:center;padding:40px;
    background:#050508;text-align:center;font-size:.85rem;line-height:1.7;color:var(--ui-dim);
  }
  @media (prefers-reduced-motion:reduce){#hello p{animation:none;}}
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="hello"><p>Leg einen Finger auf</p></div>

<button id="knob" aria-label="Einstellungen"></button>

<div id="panel" role="dialog" aria-label="Einstellungen" aria-hidden="true">
  <h2>Abdruck</h2>
  <div id="pals"></div>

  <div class="row">
    <label for="s-ridge">Rillendichte <output id="o-ridge"></output></label>
    <input type="range" id="s-ridge" min="10" max="52" step="1">
  </div>
  <div class="row">
    <label for="s-glow">Nachglühen <output id="o-glow"></output></label>
    <input type="range" id="s-glow" min="0.4" max="6" step="0.1">
  </div>
  <div class="row">
    <label for="s-flow">Strömung <output id="o-flow"></output></label>
    <input type="range" id="s-flow" min="0" max="2" step="0.05">
  </div>
  <div class="row">
    <label for="s-ink">Deckkraft <output id="o-ink"></output></label>
    <input type="range" id="s-ink" min="0.2" max="1" step="0.05">
  </div>

  <div class="row switch">
    <span>Bildschirm wach</span>
    <button id="b-wake" aria-pressed="false">aus</button>
  </div>

  <p class="hint">
    Zwei Finger, doppelt getippt: nächste Palette.<br>
    Alles bleibt auf diesem Gerät.
  </p>

  <button id="close">schließen</button>
</div>

<div id="fail"><div>
  Dieses Gerät kann kein WebGL.<br>Ohne das läuft Abdruck nicht.
</div></div>

<script>
"use strict";
(() => {

/* ==========================================================================
   PALETTEN — zyklische Verläufe, aus den Gradient-Vorlagen abgeleitet.
   Jede Liste wird im Kreis geschlossen (letzte Farbe blendet in die erste).
   ========================================================================== */
const PALETTES = [
  { id:"nebel",  name:"Nebel",  stops:["#4646ff","#7f4dff","#b263fc","#e92bff","#ff2f92","#ff6b8b","#5db4ff"] },
  { id:"retro",  name:"Retro",  stops:["#f4ff4a","#37f877","#29cdf8","#4646ff","#a71979","#e92bff","#ff4331","#fdd034"] },
  { id:"sonne",  name:"Sonne",  stops:["#ffd852","#ff9f1c","#f02167","#871080","#3a0b52","#d9564e","#ffc300"] },
  { id:"aqua",   name:"Aqua",   stops:["#00c1ff","#3fcaea","#37f877","#f7f681","#fa9b91","#b263fc","#1148ab"] },
  { id:"abend",  name:"Abend",  stops:["#ff6b8b","#f670c1","#b263fc","#480bf7","#141046","#0a0a18","#7a3b6e"] },
  { id:"tusche", name:"Tusche", stops:["#ffffff","#cfcfda","#8a8a99","#33333d","#0b0b10","#22222a","#9b9baa"] }
];

/* 8 Stützstellen pro Palette — der Shader rechnet mit fester Länge. */
function resample(stops){
  const rgb = stops.map(hex => [
    parseInt(hex.slice(1,3),16)/255,
    parseInt(hex.slice(3,5),16)/255,
    parseInt(hex.slice(5,7),16)/255
  ]);
  const closed = rgb.concat([rgb[0]]);       // Kreis schließen
  const n = rgb.length;
  const out = new Float32Array(8*3);
  for(let k=0;k<8;k++){
    const x = (k/7)*n, i = Math.min(Math.floor(x), n-1), f = x - i;
    const a = closed[i], b = closed[i+1];
    out[k*3  ] = a[0] + (b[0]-a[0])*f;
    out[k*3+1] = a[1] + (b[1]-a[1])*f;
    out[k*3+2] = a[2] + (b[2]-a[2])*f;
  }
  return out;
}
PALETTES.forEach(p => { p.data = resample(p.stops); });

/* ==========================================================================
   EINSTELLUNGEN — bleiben auf dem Gerät
   ========================================================================== */
const DEFAULTS = { pal:0, ridge:28, glow:2.2, flow:1, ink:0.85, wake:false };
let CFG = Object.assign({}, DEFAULTS);
try{
  const s = localStorage.getItem("abdruck.cfg");
  if(s) CFG = Object.assign(CFG, JSON.parse(s));
}catch(e){}
const save = () => { try{ localStorage.setItem("abdruck.cfg", JSON.stringify(CFG)); }catch(e){} };

/* ==========================================================================
   WEBGL
   ========================================================================== */
const MAXT = 5;    // gleichzeitige Finger
const MAXS = 18;   // liegengebliebene Abdrücke + Schleifspur

const cv = document.getElementById("c");
const glOpts = { alpha:false, antialias:false, depth:false, stencil:false,
                 powerPreference:"high-performance", preserveDrawingBuffer:false };
let gl = cv.getContext("webgl2", glOpts);
let isGL2 = !!gl;
if(!gl) gl = cv.getContext("webgl", glOpts) || cv.getContext("experimental-webgl", glOpts);
if(!gl){ document.getElementById("fail").style.display = "grid"; return; }

const VERT = `
attribute vec2 a;
void main(){ gl_Position = vec4(a, 0.0, 1.0); }
`;

const FRAG_BODY = `
uniform vec2  uRes;
uniform float uTime;
uniform float uZoom;
uniform float uHue;
uniform float uEnergy;
uniform float uRidge;
uniform float uInk;
uniform vec3  uPal[8];
uniform vec4  uTouch[${MAXT*2}];
uniform vec4  uStamp[${MAXS*2}];

/* ---------- Simplex-Rauschen (Ashima) ---------- */
vec3 mod289(vec3 x){ return x - floor(x*(1.0/289.0))*289.0; }
vec2 mod289(vec2 x){ return x - floor(x*(1.0/289.0))*289.0; }
vec3 permute(vec3 x){ return mod289(((x*34.0)+1.0)*x); }
float snoise(vec2 v){
  const vec4 C = vec4(0.211324865405187, 0.366025403784439,
                     -0.577350269189626, 0.024390243902439);
  vec2 i  = floor(v + dot(v, C.yy));
  vec2 x0 = v - i + dot(i, C.xx);
  vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
  vec4 x12 = x0.xyxy + C.xxzz;
  x12.xy -= i1;
  i = mod289(i);
  vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0))
                          + i.x + vec3(0.0, i1.x, 1.0));
  vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
  m = m*m; m = m*m;
  vec3 x  = 2.0 * fract(p * C.www) - 1.0;
  vec3 h  = abs(x) - 0.5;
  vec3 ox = floor(x + 0.5);
  vec3 a0 = x - ox;
  m *= 1.79284291400159 - 0.85373472095314 * (a0*a0 + h*h);
  vec3 g;
  g.x  = a0.x  * x0.x   + h.x  * x0.y;
  g.yz = a0.yz * x12.xz + h.yz * x12.yw;
  return 130.0 * dot(m, g);
}
float fbm(vec2 p){
  float s = 0.0, a = 0.5;
  mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
  for(int i=0;i<4;i++){ s += a*snoise(p); p = m*p; a *= 0.5; }
  return s;
}
/* weiche Variante — trägt die Farbflächen, ohne sie zu marmorieren */
float fbmSoft(vec2 p){
  float s = 0.0, a = 0.62;
  mat2 m = mat2(1.55, 1.1, -1.1, 1.55);
  for(int i=0;i<3;i++){ s += a*snoise(p); p = m*p; a *= 0.40; }
  return s;
}
/* die Strömung wird zwölfmal je Pixel ausgewertet — hier zählt jede Oktave */
float fbmFlow(vec2 p){
  return 0.68*snoise(p) + 0.27*snoise(mat2(1.55,1.1,-1.1,1.55)*p);
}

/* ---------- Palette ---------- */
vec3 palette(float t){
  float x = fract(t) * 7.0;
  float i = floor(x);
  float f = x - i;
  f = f*f*(3.0-2.0*f);
  vec3 c = uPal[0];
  for(int k=0;k<7;k++){
    if(float(k) == i) c = mix(uPal[k], uPal[k+1], f);
  }
  return c;
}

/* ---------- Strömungsfeld: verschachtelte Domänenverzerrung ----------
   Große, weiche Flächen — kein Marmorpapier. Die Verzerrung bleibt gedämpft,
   damit die Farbe fließt statt zu zerfasern. */
vec3 flow(vec2 p, float t){
  p *= 0.82;
  vec2 q = vec2(fbmFlow(p + 0.085*t),
                fbmFlow(p + vec2(3.7,1.9) - 0.070*t));
  vec2 r = vec2(fbmFlow(p + 1.15*q + vec2(1.7,9.2) + 0.055*t),
                fbmFlow(p + 1.15*q + vec2(8.3,2.8) - 0.045*t));
  float f = fbmFlow(p + 1.45*r);
  return vec3(f, dot(r,r), q.x);
}

/* ---------- Drehung ---------- */
vec2 rot(vec2 v, float a){
  float c = cos(a), s = sin(a);
  return vec2(c*v.x - s*v.y, s*v.x + c*v.y);
}

void main(){
  vec2 p0 = (gl_FragCoord.xy - 0.5*uRes) / uRes.y;

  /* ---- Finger ziehen die Strömung in einen Wirbel ---- */
  vec2 p = p0;
  for(int i=0;i<${MAXT};i++){
    vec4 A = uTouch[i*2];
    vec4 B = uTouch[i*2+1];
    if(B.z > 0.0){
      vec2 d = p0 - A.xy;
      float w = exp(-dot(d,d)*11.0) * (0.30 + 0.55*B.w);
      p += vec2(-d.y, d.x) * w * 1.05;
      p -= d * w * 0.55;
    }
  }

  /* ---- Durchflug: zwei Zoomstufen überblendet, damit es nie endet ---- */
  float za = fract(uZoom);
  vec3 fA = flow(p * exp2(-za),       uTime);
  vec3 fB = flow(p * exp2(1.0 - za),  uTime);
  vec3 F  = mix(fA, fB, smoothstep(0.0, 1.0, za));

  float tone = F.x*0.26 + F.z*0.06 + uHue;
  vec3 col = palette(tone);
  col = mix(col, palette(tone + 0.11), clamp(F.y*0.8, 0.0, 1.0)*0.65);
  col *= 0.70 + 0.46*smoothstep(-1.1, 1.3, F.z);
  col += palette(tone + 0.30) * pow(clamp(F.x*0.55 + 0.5, 0.0, 1.0), 5.0) * 0.55;

  /* ---- Rillenphase: wandernder Irrgarten, um jeden Finger ein Kern ---- */
  vec2 wv = vec2(fbmSoft(p0*0.95 + 4.1 + uTime*0.012),
                 fbmSoft(p0*0.95 - 2.7 - uTime*0.010));
  float phase = fbmSoft(p0*1.05 + wv*0.75) * uRidge * 0.80;

  float ink = 0.0, glow = 0.0, scan = 0.0, contact = 0.0;
  /* Kerne überlagern sich nicht — der nächstgelegene setzt sich durch,
     sonst entsteht dort, wo zwei Abdrücke aneinanderstoßen, Moiré. */
  float coreW = 0.0, coreP = 0.0;

  for(int i=0;i<${MAXT};i++){
    vec4 A = uTouch[i*2];      // x, y, rx, ry
    vec4 B = uTouch[i*2+1];    // winkel, wachstum, aktiv, kraft
    if(B.z > 0.0){
      vec2 d  = rot(p0 - A.xy, -B.x);
      vec2 e  = d / max(A.zw, vec2(1e-4));
      float rr = length(e);
      float seed = fract(A.x*13.7 + A.y*7.3) * 6.2831;

      /* Kern: keine Zielscheibe, sondern eine Schleife mit Delta */
      float infl = smoothstep(2.6, 0.1, rr);
      if(infl > coreW){
        float th = atan(e.y, e.x);
        coreW = infl;
        coreP = rr*uRidge*0.46
              + 1.05*sin(th + seed)
              + 0.34*sin(th*2.0 - seed*1.7)
              + 0.55*snoise(e*1.45 + seed);
      }

      float g    = B.y*1.06;
      float foot = 1.0 - smoothstep(0.74, 1.02, rr);
      float draw = 1.0 - smoothstep(g, g + 0.20, rr);
      float m    = foot*draw;
      ink     = max(ink, m);
      contact = max(contact, foot);

      float q = (rr - g)/0.075;
      scan += exp(-q*q) * foot * (0.35 + 0.5*B.w);
    }
  }

  /* ---- liegengebliebene Abdrücke und Schleifspur ---- */
  for(int i=0;i<${MAXS};i++){
    vec4 A = uStamp[i*2];      // x, y, rx, ry
    vec4 B = uStamp[i*2+1];    // winkel, wachstum, leben, deckkraft
    if(B.z > 0.0){
      vec2 d  = rot(p0 - A.xy, -B.x);
      vec2 e  = d / max(A.zw, vec2(1e-4));
      float rr = length(e);
      if(rr < 1.5){
        /* ein liegengebliebener Abdruck behält seinen Kern — sonst zerfällt er
           beim Loslassen in das Irrgartenmuster des Untergrunds */
        float infl = smoothstep(1.45, 0.1, rr);
        if(infl > coreW){
          float seed = fract(A.x*13.7 + A.y*7.3) * 6.2831;
          float th   = atan(e.y, e.x);
          coreW = infl;
          coreP = rr*uRidge*0.46
                + 1.05*sin(th + seed)
                + 0.34*sin(th*2.0 - seed*1.7)
                + 0.55*snoise(e*1.45 + seed);
        }

        float g    = B.y*1.06;
        float foot = 1.0 - smoothstep(0.70, 1.02, rr);
        float draw = 1.0 - smoothstep(g, g + 0.24, rr);
        float m    = foot*draw*B.w;
        ink   = max(ink, m*clamp(B.z, 0.0, 1.0));
        glow += m*B.z*B.z;
      }
    }
  }

  /* ---- Rillen zeichnen ---- */
  phase = mix(phase, coreP, coreW*0.94);
  float tri = abs(fract(phase) - 0.5) * 2.0;
#ifdef HAS_DERIV
  float aaw = clamp(fwidth(phase)*2.0, 0.03, 0.85);
#else
  float aaw = 0.20;
#endif
  float line = 1.0 - smoothstep(0.0, 0.26 + aaw, tri);
  line *= 1.0 - smoothstep(0.40, 0.95, aaw);          // zu dicht = ausblenden
  line *= smoothstep(-0.62, -0.08, snoise(p0*8.5 + 21.0));  // Unterbrechungen, Minutien

  vec3 rc = palette(uHue + 0.46 + F.x*0.18 + phase*0.0035);
  vec3 hot = mix(rc, vec3(1.0), 0.38);

  ink  = clamp(ink, 0.0, 1.0) * uInk;
  glow = clamp(glow, 0.0, 2.5) * uInk;

  col  = mix(col, col*0.16, clamp(contact + glow*0.5, 0.0, 1.0)*0.62*uInk);  // Kontaktschatten
  col += rc  * line * ink  * (1.05 + 1.25*uEnergy);    // die Rillen selbst
  col += hot * line * ink  * 0.30;                     // heller Grat
  col += hot * line * glow * 1.7;                      // Nachglühen
  col += rc  * scan * 0.65;                            // Kante des Scanners
  col += hot * scan * scan * 0.30;

  /* ---- Abschluss ---- */
  float v = length((gl_FragCoord.xy - 0.5*uRes)/uRes.y);
  col *= 1.0 - 0.30*smoothstep(0.35, 1.05, v);
  col += (fract(sin(dot(gl_FragCoord.xy + uTime, vec2(12.9898,78.233)))*43758.5453) - 0.5) * 0.022;

  gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}
`;

/* Ableitungen (fwidth) glätten die Rillen. In WebGL1 braucht es die Erweiterung,
   in WebGL2 die Direktive — beides kann fehlschlagen, dann eben ohne. */
let hasDeriv = isGL2 || !!gl.getExtension("OES_standard_derivatives");

let precision = "mediump";
const hp = gl.getShaderPrecisionFormat(gl.FRAGMENT_SHADER, gl.HIGH_FLOAT);
if(hp && hp.precision > 0) precision = "highp";

function makeHead(deriv){
  return (deriv ? "#extension GL_OES_standard_derivatives : enable\n#define HAS_DERIV 1\n" : "")
       + "precision " + precision + " float;\n";
}

function compile(type, src, quiet){
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if(!gl.getShaderParameter(sh, gl.COMPILE_STATUS)){
    if(!quiet) console.error(gl.getShaderInfoLog(sh));
    gl.deleteShader(sh);
    return null;
  }
  return sh;
}

let prog, U = {}, quad;

function build(){
  const vs = compile(gl.VERTEX_SHADER, VERT);
  let fs = null;
  if(hasDeriv) fs = compile(gl.FRAGMENT_SHADER, makeHead(true) + FRAG_BODY, true);
  if(!fs){ hasDeriv = false; fs = compile(gl.FRAGMENT_SHADER, makeHead(false) + FRAG_BODY); }
  if(!vs || !fs){ document.getElementById("fail").style.display = "grid"; return false; }
  prog = gl.createProgram();
  gl.attachShader(prog, vs); gl.attachShader(prog, fs);
  gl.bindAttribLocation(prog, 0, "a");
  gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog, gl.LINK_STATUS)){
    console.error(gl.getProgramInfoLog(prog));
    document.getElementById("fail").style.display = "grid";
    return false;
  }
  gl.useProgram(prog);
  ["uRes","uTime","uZoom","uHue","uEnergy","uRidge","uInk"].forEach(n => {
    U[n] = gl.getUniformLocation(prog, n);
  });
  U.uPal   = gl.getUniformLocation(prog, "uPal[0]");
  U.uTouch = gl.getUniformLocation(prog, "uTouch[0]");
  U.uStamp = gl.getUniformLocation(prog, "uStamp[0]");

  quad = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  return true;
}
if(!build()) return;

/* ==========================================================================
   AUFLÖSUNG — passt sich an, wenn das Gerät ins Schwitzen kommt
   ========================================================================== */
const rawDpr = window.devicePixelRatio || 1;
let renderScale = rawDpr >= 2 ? 0.8 : 1;     // dichte Displays fangen tiefer an
let cssW = 1, cssH = 1;
function resize(){
  cssW = window.innerWidth;
  cssH = window.innerHeight;
  const dpr = Math.min(rawDpr, 2);
  const w = Math.max(1, Math.round(cssW * dpr * renderScale));
  const h = Math.max(1, Math.round(cssH * dpr * renderScale));
  if(cv.width !== w || cv.height !== h){
    cv.width = w; cv.height = h;
    gl.viewport(0, 0, w, h);
  }
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => setTimeout(resize, 250));
resize();

/* ==========================================================================
   BERÜHRUNG
   ========================================================================== */
const touches = new Map();          // id -> Finger
const stamps  = [];                 // liegengebliebene Abdrücke

const GROW   = 0.85;                // Sekunden, bis das Muster fertig gezeichnet ist
const TRAIL  = 0.75;                // Lebensdauer eines Spurpunkts
const FOOT   = 24;                  // Ersatzradius in CSS-Pixeln, wenn Safari nichts liefert
const PAD    = 1.65;                // Safaris Radius fällt kleiner aus als die echte Kuppe

const toField = (x, y) => [ (x - cssW/2)/cssH, (cssH/2 - y)/cssH ];
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);

function readTouch(t){
  let rx = clamp((t.radiusX && t.radiusX > 1) ? t.radiusX : FOOT, 12, 64) * PAD;
  let ry = clamp((t.radiusY && t.radiusY > 1) ? t.radiusY : FOOT*1.3, 12, 78) * PAD;
  ry = Math.max(ry, rx*1.22);       // die Kuppe liegt länglich auf, nie rund
  const ang = ((t.rotationAngle || 0) * Math.PI) / 180;
  const force = (typeof t.force === "number" && t.force > 0) ? Math.min(t.force, 1) : -1;
  return { rx, ry, ang: -ang, force };
}

function begin(id, x, y, raw){
  const [fx, fy] = toField(x, y);
  const r = readTouch(raw);
  touches.set(id, {
    x:fx, y:fy, px:fx, py:fy,
    rx:r.rx, ry:r.ry, ang:r.ang,
    rawForce:r.force, force:0.35,
    born:now, moved:0, speed:0, lastStamp:0
  });
  hideHello();
}
function move(id, x, y, raw){
  const t = touches.get(id); if(!t) return;
  const [fx, fy] = toField(x, y);
  const r = readTouch(raw);
  t.px = t.x; t.py = t.y;
  t.x = fx; t.y = fy;
  t.rx = r.rx; t.ry = r.ry; t.ang = r.ang; t.rawForce = r.force;
}
function end(id){
  const t = touches.get(id); if(!t) return;
  touches.delete(id);
  // der Abdruck bleibt liegen und glüht nach
  stamps.push({
    x:t.x, y:t.y,
    rx:t.rx/cssH*(0.9 + 0.5*t.force), ry:t.ry/cssH*(0.9 + 0.5*t.force),
    ang:t.ang, born:t.born, released:now,
    dur:CFG.glow, op:1.0
  });
  prune();
}
function prune(){
  while(stamps.length > MAXS) stamps.shift();
}

const opt = { passive:false };
cv.addEventListener("touchstart", e => {
  e.preventDefault();
  const c = e.changedTouches;
  for(let k=0;k<c.length;k++) begin(c[k].identifier, c[k].clientX, c[k].clientY, c[k]);
}, opt);
cv.addEventListener("touchmove", e => {
  e.preventDefault();
  const c = e.changedTouches;
  for(let k=0;k<c.length;k++) move(c[k].identifier, c[k].clientX, c[k].clientY, c[k]);
}, opt);
const lift = e => {
  e.preventDefault();
  const c = e.changedTouches;
  for(let k=0;k<c.length;k++) end(c[k].identifier);
};
cv.addEventListener("touchend", lift, opt);
cv.addEventListener("touchcancel", lift, opt);

/* Maus — nur damit es am Rechner prüfbar ist */
let mouseDown = false;
cv.addEventListener("mousedown", e => { mouseDown = true; begin("m", e.clientX, e.clientY, {}); });
window.addEventListener("mousemove", e => { if(mouseDown) move("m", e.clientX, e.clientY, {}); });
window.addEventListener("mouseup", () => { if(mouseDown){ mouseDown = false; end("m"); } });

/* Zwei Finger, Doppeltipp: Palette weiter */
let lastTwo = 0;
cv.addEventListener("touchstart", e => {
  if(e.touches.length !== 2) return;
  const t = performance.now();
  if(t - lastTwo < 420){ setPalette((CFG.pal + 1) % PALETTES.length); lastTwo = 0; }
  else lastTwo = t;
}, opt);

/* Kein Doppeltipp-Zoom, kein Kontextmenü */
document.addEventListener("gesturestart", e => e.preventDefault());
document.addEventListener("contextmenu", e => e.preventDefault());

/* ==========================================================================
   SCHLEIFE
   ========================================================================== */
const touchBuf = new Float32Array(MAXT*2*4);
const stampBuf = new Float32Array(MAXS*2*4);

let now = 0, last = 0, zoom = 0, hue = Math.random(), energy = 0;
let frames = 0, acc = 0, running = true;

function frame(ms){
  if(!running) return;
  requestAnimationFrame(frame);

  const tSec = ms/1000;
  let dt = last ? Math.min(tSec - last, 0.05) : 0.016;
  last = tSec; now += dt;

  /* --- Energie aus Anzahl, Tempo und Druck --- */
  let target = 0, n = 0;
  touches.forEach(t => {
    const dx = t.x - t.px, dy = t.y - t.py;
    const inst = Math.hypot(dx, dy)/Math.max(dt, 1e-3);
    t.speed += (inst - t.speed)*0.25;
    t.px = t.x; t.py = t.y;
    const dwell = now - t.born;
    t.force = t.rawForce >= 0
      ? t.rawForce
      : Math.min(0.25 + dwell*0.55 + t.speed*0.22, 1);
    target += 0.34 + Math.min(t.speed*0.8, 0.85) + t.force*0.35;
    n++;
  });
  if(n) target = Math.min(target/n + (n-1)*0.1, 1.7);
  energy += (target - energy) * (target > energy ? 0.10 : 0.022);

  zoom += dt * (0.022 + energy*0.30) * CFG.flow;
  hue  += dt * (0.006 + energy*0.045) * CFG.flow;

  /* --- Spurpunkte fallen lassen, solange gezogen wird --- */
  touches.forEach(t => {
    if(t.speed > 0.05 && now - t.lastStamp > 0.042){
      t.lastStamp = now;
      const f = 0.9 + 0.5*t.force;
      stamps.push({
        x:t.x, y:t.y, rx:t.rx/cssH*f*0.9, ry:t.ry/cssH*f*0.9,
        ang:t.ang, born:now - GROW, released:now,
        dur:TRAIL, op:0.32
      });
    }
  });
  prune();

  /* --- aktive Finger in den Puffer --- */
  touchBuf.fill(0);
  let i = 0;
  touches.forEach(t => {
    if(i >= MAXT) return;
    const f = 0.9 + 0.5*t.force;
    const o = i*8;
    touchBuf[o  ] = t.x;
    touchBuf[o+1] = t.y;
    touchBuf[o+2] = Math.max(t.rx/cssH*f, 0.004);
    touchBuf[o+3] = Math.max(t.ry/cssH*f, 0.004);
    touchBuf[o+4] = t.ang;
    touchBuf[o+5] = Math.min((now - t.born)/GROW, 1);
    touchBuf[o+6] = 1;
    touchBuf[o+7] = t.force;
    i++;
  });

  /* --- liegengebliebene Abdrücke --- */
  for(let k = stamps.length - 1; k >= 0; k--){
    if(now - stamps[k].released > stamps[k].dur) stamps.splice(k, 1);
  }
  stampBuf.fill(0);
  const nS = Math.min(stamps.length, MAXS);
  for(let j = 0; j < nS; j++){
    const s = stamps[stamps.length - 1 - j];       // jüngste zuerst
    const u = (now - s.released)/s.dur;
    const life = Math.pow(1 - u, 1.7) * (1 + 0.9*Math.exp(-u*7));
    const o = j*8;
    stampBuf[o  ] = s.x;
    stampBuf[o+1] = s.y;
    stampBuf[o+2] = Math.max(s.rx, 0.004);
    stampBuf[o+3] = Math.max(s.ry, 0.004);
    stampBuf[o+4] = s.ang;
    stampBuf[o+5] = Math.min((now - s.born)/GROW, 1);
    stampBuf[o+6] = life;
    stampBuf[o+7] = s.op;
  }

  /* --- zeichnen --- */
  gl.uniform2f(U.uRes, cv.width, cv.height);
  gl.uniform1f(U.uTime, now);
  gl.uniform1f(U.uZoom, zoom);
  gl.uniform1f(U.uHue, hue);
  gl.uniform1f(U.uEnergy, energy);
  gl.uniform1f(U.uRidge, CFG.ridge);
  gl.uniform1f(U.uInk, CFG.ink);
  gl.uniform3fv(U.uPal, PALETTES[CFG.pal].data);
  gl.uniform4fv(U.uTouch, touchBuf);
  gl.uniform4fv(U.uStamp, stampBuf);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  /* --- Auflösung nachregeln --- */
  acc += dt; frames++;
  if(frames >= 30){
    const avg = acc/frames;
    if(avg > 0.022 && renderScale > 0.45){ renderScale = Math.max(0.45, renderScale - 0.15); resize(); }
    else if(avg < 0.0135 && renderScale < 1){ renderScale = Math.min(1, renderScale + 0.08); resize(); }
    acc = 0; frames = 0;
  }
}
requestAnimationFrame(frame);

document.addEventListener("visibilitychange", () => {
  if(document.hidden){ running = false; }
  else if(!running){ running = true; last = 0; requestAnimationFrame(frame); releaseWake(); if(CFG.wake) askWake(); }
});

cv.addEventListener("webglcontextlost", e => { e.preventDefault(); running = false; });
cv.addEventListener("webglcontextrestored", () => {
  U = {};
  if(build()){ resize(); running = true; last = 0; requestAnimationFrame(frame); }
});

/* ==========================================================================
   BILDSCHIRM WACH HALTEN
   ========================================================================== */
let wakeLock = null;
async function askWake(){
  try{ if("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); }
  catch(e){}
}
function releaseWake(){ try{ wakeLock && wakeLock.release(); }catch(e){} wakeLock = null; }
if(CFG.wake) askWake();

/* ==========================================================================
   OBERFLÄCHE
   ========================================================================== */
const hello = document.getElementById("hello");
let helloGone = false;
function hideHello(){
  if(helloGone) return;
  helloGone = true;
  hello.classList.add("gone");
  setTimeout(() => hello.remove(), 1300);
}
setTimeout(() => { if(!helloGone) hideHello(); }, 14000);

const knob  = document.getElementById("knob");
const panel = document.getElementById("panel");
let knobTimer = null;
function wakeKnob(){
  knob.classList.add("awake");
  clearTimeout(knobTimer);
  knobTimer = setTimeout(() => knob.classList.remove("awake"), 2600);
}
wakeKnob();
window.addEventListener("touchstart", wakeKnob, { passive:true });

function openPanel(v){
  panel.classList.toggle("open", v);
  panel.setAttribute("aria-hidden", v ? "false" : "true");
}
knob.addEventListener("click", () => openPanel(!panel.classList.contains("open")));
document.getElementById("close").addEventListener("click", () => openPanel(false));

/* Palettenfelder */
const palsEl = document.getElementById("pals");
PALETTES.forEach((p, idx) => {
  const b = document.createElement("button");
  b.className = "sw";
  b.type = "button";
  b.style.background = "linear-gradient(135deg," + p.stops.join(",") + ")";
  b.setAttribute("aria-pressed", String(idx === CFG.pal));
  b.setAttribute("aria-label", "Palette " + p.name);
  b.innerHTML = "<span>" + p.name + "</span>";
  b.addEventListener("click", () => setPalette(idx));
  palsEl.appendChild(b);
});
function setPalette(i){
  CFG.pal = i; save();
  [...palsEl.children].forEach((el, k) => el.setAttribute("aria-pressed", String(k === i)));
}

/* Regler */
function bind(id, key, fmt){
  const el = document.getElementById("s-" + id);
  const out = document.getElementById("o-" + id);
  el.value = CFG[key];
  out.textContent = fmt(CFG[key]);
  el.addEventListener("input", () => {
    CFG[key] = parseFloat(el.value);
    out.textContent = fmt(CFG[key]);
    save();
  });
}
bind("ridge", "ridge", v => Math.round(v));
bind("glow",  "glow",  v => v.toFixed(1) + " s");
bind("flow",  "flow",  v => Math.round(v*100) + " %");
bind("ink",   "ink",   v => Math.round(v*100) + " %");

const wakeBtn = document.getElementById("b-wake");
function paintWake(){
  wakeBtn.setAttribute("aria-pressed", String(!!CFG.wake));
  wakeBtn.textContent = CFG.wake ? "an" : "aus";
}
paintWake();
wakeBtn.addEventListener("click", () => {
  CFG.wake = !CFG.wake; save(); paintWake();
  if(CFG.wake) askWake(); else releaseWake();
});

/* ==========================================================================
   SERVICE WORKER — offline
   ========================================================================== */
if("serviceWorker" in navigator && location.protocol !== "file:"){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

})();
</script>
